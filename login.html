<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f2f2f7">
<title>Sign in — MED ARC</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --accent: #007AFF;
  --bg: #f2f2f7;
  --glass: rgba(255,255,255,0.75);
  --glass-border: rgba(255,255,255,0.6);
  --ink: #1c1c1e;
  --muted: #8e8e93;
  --shadow: 0 8px 40px rgba(0,0,0,0.1), 0 1px 3px rgba(0,0,0,0.06);
}

body {
  min-height: 100dvh;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
  padding: 24px;
  background-image:
    radial-gradient(ellipse at 20% 20%, rgba(0,122,255,0.08) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 80%, rgba(175,82,222,0.06) 0%, transparent 60%);
}

.card {
  background: var(--glass);
  backdrop-filter: blur(24px) saturate(1.8);
  -webkit-backdrop-filter: blur(24px) saturate(1.8);
  border: 1px solid var(--glass-border);
  border-radius: 24px;
  box-shadow: var(--shadow);
  padding: 48px 40px 40px;
  width: 100%;
  max-width: 400px;
  text-align: center;
}

.logo {
  width: 64px;
  height: 64px;
  background: linear-gradient(135deg, #007AFF, #5856D6);
  border-radius: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 20px;
  box-shadow: 0 4px 16px rgba(0,122,255,0.3);
}

.logo svg { width: 32px; height: 32px; }

h1 {
  font-size: 26px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: -0.5px;
  margin-bottom: 6px;
}

.subtitle {
  font-size: 15px;
  color: var(--muted);
  margin-bottom: 36px;
  line-height: 1.5;
}

.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 24px 0;
  color: var(--muted);
  font-size: 12px;
}
.divider::before, .divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: rgba(60,60,67,0.12);
}

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  padding: 14px 20px;
  border-radius: 14px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: transform 0.1s, box-shadow 0.1s, opacity 0.1s;
  text-decoration: none;
  margin-bottom: 12px;
}
.btn:hover { transform: translateY(-1px); opacity: 0.92; }
.btn:active { transform: translateY(0); }

.btn-github {
  background: #24292e;
  color: #fff;
  box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}

.btn-google {
  background: #fff;
  color: #3c4043;
  border: 1px solid rgba(0,0,0,0.12);
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
}

.btn svg { flex-shrink: 0; }

.footer {
  margin-top: 28px;
  font-size: 12px;
  color: var(--muted);
  line-height: 1.6;
}

.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: #1c1c1e;
  color: #fff;
  padding: 10px 20px;
  border-radius: 20px;
  font-size: 14px;
  transition: transform 0.3s ease;
  pointer-events: none;
  white-space: nowrap;
  z-index: 999;
}
.toast.show { transform: translateX(-50%) translateY(0); }

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000;
    --glass: rgba(28,28,30,0.85);
    --glass-border: rgba(255,255,255,0.08);
    --ink: #f2f2f7;
    --muted: #8e8e93;
  }
  .btn-google { background: #2c2c2e; color: #f2f2f7; border-color: rgba(255,255,255,0.1); }
}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M6 24L12 11L16 18L20 13L26 24" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <h1>MED ARC</h1>
  <p class="subtitle">Your personal study planner.<br>Sign in to sync across all your devices.</p>

  <a href="/auth/github" class="btn btn-github">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 2C6.477 2 2 6.477 2 12c0 4.418 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.342-3.369-1.342-.454-1.155-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0 1 12 6.836a9.59 9.59 0 0 1 2.504.337c1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.202 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.163 22 16.418 22 12c0-5.523-4.477-10-10-10z"/>
    </svg>
    Continue with GitHub
  </a>

  <div class="divider">or</div>

  <a href="/auth/google" class="btn btn-google">
    <svg width="20" height="20" viewBox="0 0 24 24">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
    </svg>
    Continue with Google
  </a>

  <p class="footer">
    Your data is stored securely and syncs across all your devices.<br>
    No password required.
  </p>
</div>

<div class="toast" id="toast"></div>

<script>
  // Show error toast if redirected back with error
  const p = new URLSearchParams(window.location.search);
  if (p.get('auth') === 'error') {
    history.replaceState({}, '', '/login');
    const t = document.getElementById('toast');
    t.textContent = 'Sign-in failed. Please try again.';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }
</script>
</body>
</html>
