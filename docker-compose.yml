services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://medarc:medarc-local-only@db:5432/medarc
      PGSSL: "false"
    ports:
      - "${PORT:-3000}:3000"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: medarc
      POSTGRES_USER: medarc
      POSTGRES_PASSWORD: medarc-local-only
    volumes:
      - med_arc_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medarc -d medarc"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  med_arc_data:
